{% extends "base.html" %}
{% block title %}Log in · FarmLink{% endblock %}
{% block content %}
<form class="card narrow" method="post">
  <h1>Log in</h1>
  <label>Phone number <input name="phone" required placeholder="03xx xxxxxxx"></label>
  <label>Password <input type="password" name="password" required></label>
  <button class="btn" type="submit">Log in</button>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>
{% endblock %}
