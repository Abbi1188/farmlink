{% extends "base.html" %}
{% block title %}Farm profile · FarmLink{% endblock %}
{% block content %}
<h1>{{ 'Edit farm profile' if farm else 'Set up your farm' }}</h1>
{% if farm %}<p class="muted">Status: <strong>{{ farm.verification_status }}</strong></p>{% endif %}

<form class="card" method="post">
  <label>Farm name <input name="farm_name" required value="{{ farm.farm_name if farm else '' }}"></label>
  <label>About your farm <textarea name="description" rows="3">{{ farm.description if farm and farm.description else '' }}</textarea></label>

  <h3>Farm location</h3>
  <label>Address <input name="address_text" required value="{{ farm.address_text if farm else '' }}"></label>
  <div class="row">
    <label>City <input name="city" required value="{{ farm.city if farm else '' }}"></label>
    <label>District <input name="district" required value="{{ farm.district if farm else '' }}"></label>
    <label>Province <input name="province" required value="{{ farm.province if farm else 'Khyber Pakhtunkhwa' }}"></label>
  </div>
  <div class="row">
    <label>Latitude <input name="latitude" id="latitude" required value="{{ farm.latitude if farm else '' }}"></label>
    <label>Longitude <input name="longitude" id="longitude" required value="{{ farm.longitude if farm else '' }}"></label>
    <button type="button" class="btn secondary" data-fill-location="latitude,longitude">Use my location</button>
  </div>

  <h3>Pickup and delivery</h3>
  <label class="check"><input type="checkbox" name="pickup_enabled" {{ 'checked' if not farm or farm.pickup_enabled }}> Buyers can pick up from the farm</label>
  <label>Pickup hours <input name="pickup_hours" placeholder="9am - 6pm" value="{{ farm.pickup_hours if farm and farm.pickup_hours else '' }}"></label>
  <label class="check"><input type="checkbox" name="delivery_enabled" {{ 'checked' if farm and farm.delivery_enabled }}> I deliver</label>
  <div class="row">
    <label>Delivery radius (km) <input type="number" step="0.5" name="delivery_radius_km" value="{{ farm.delivery_radius_km if farm else 10 }}"></label>
    <label>Delivery fee (Rs) <input type="number" step="1" name="delivery_fee" value="{{ farm.delivery_fee if farm else 0 }}"></label>
    <label>Minimum order (Rs) <input type="number" step="1" name="min_order" value="{{ farm.min_order if farm else 0 }}"></label>
  </div>
  <button class="btn" type="submit">Save profile</button>
</form>
{% endblock %}
